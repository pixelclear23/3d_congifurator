<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" width="1220" height="700"
     role="img" aria-labelledby="bldTitle bldDesc"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="bldTitle">The browser-based UI builder</title>
  <desc id="bldDesc">A browser page with a live canvas on the left and an inspector on the right. The canvas shows the configurator being laid out over the car: view pills, a logo, a row of paint swatches and a tab strip. The inspector lists global options and one card per category, with controls for icon size, labels, shape, dock edge and per-option icons and sounds.</desc>

  <defs>
    <radialGradient id="stageBg" cx="52%" cy="42%" r="72%">
      <stop offset="0" stop-color="#2a323c"/>
      <stop offset="55%" stop-color="#15191e"/>
      <stop offset="1" stop-color="#0c0e11"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4854"/>
      <stop offset="1" stop-color="#171c21"/>
    </linearGradient>
  </defs>

  <rect width="1220" height="700" fill="#0e1013"/>

  <!-- ===== top toolbar ===== -->
  <rect x="0" y="0" width="1220" height="42" fill="#161b21"/>
  <text x="18" y="26" font-size="13" font-weight="700" fill="#e6edf3">Configurator Builder</text>
  <rect x="150" y="10" width="186" height="22" rx="4" fill="#0f1317" stroke="#333c47"/>
  <text x="158" y="25" font-size="10.5" fill="#8b95a1">Configurator</text>

  <g>
    <rect x="352" y="10" width="46" height="22" rx="4" fill="#2d6fc0"/>
    <text x="375" y="25" text-anchor="middle" font-size="10.5" font-weight="600" fill="#eaf2fb">Edit</text>
    <rect x="402" y="10" width="62" height="22" rx="4" fill="#232a32" stroke="#333c47"/>
    <text x="433" y="25" text-anchor="middle" font-size="10.5" fill="#b8c2cd">Preview</text>
    <rect x="468" y="10" width="46" height="22" rx="4" fill="#232a32" stroke="#333c47"/>
    <text x="491" y="25" text-anchor="middle" font-size="10.5" fill="#b8c2cd">Code</text>
  </g>

  <g font-size="10.5">
    <rect x="736" y="10" width="76" height="22" rx="4" fill="#2d6fc0"/>
    <text x="774" y="25" text-anchor="middle" fill="#eaf2fb">+ Category</text>
    <rect x="818" y="10" width="104" height="22" rx="4" fill="#2f6b3a"/>
    <text x="870" y="25" text-anchor="middle" font-weight="600" fill="#e8f6ea">Save to Project</text>
    <rect x="928" y="10" width="86" height="22" rx="4" fill="#232a32" stroke="#333c47"/>
    <text x="971" y="25" text-anchor="middle" fill="#b8c2cd">Icons to files</text>
    <rect x="1020" y="10" width="96" height="22" rx="4" fill="#232a32" stroke="#333c47"/>
    <text x="1068" y="25" text-anchor="middle" fill="#b8c2cd">Test Connection</text>
    <rect x="1122" y="10" width="84" height="22" rx="4" fill="#232a32" stroke="#333c47"/>
    <text x="1164" y="25" text-anchor="middle" fill="#b8c2cd">Export JSON</text>
  </g>

  <!-- ===== canvas ===== -->
  <rect x="0" y="42" width="792" height="658" fill="url(#stageBg)"/>
  <text x="16" y="62" font-size="10.5" fill="#8b95a1">Configurator</text>
  <text x="96" y="62" font-size="10" fill="#5f6b78">drag chips to place them on the viewer</text>
  <text x="640" y="62" font-size="9.5" fill="#5f6b78">BAR layout · positions are automatic</text>

  <!-- view pills -->
  <g font-size="10">
    <rect x="16" y="76" width="62" height="22" rx="11" fill="#1a1f26" stroke="#3a434e"/>
    <text x="47" y="91" text-anchor="middle" fill="#c7d0da">Back View</text>
    <rect x="84" y="76" width="76" height="22" rx="11" fill="#1a1f26" stroke="#3a434e"/>
    <text x="122" y="91" text-anchor="middle" fill="#c7d0da">Interior View</text>
  </g>

  <!-- logo slot -->
  <rect x="612" y="74" width="106" height="66" rx="6" fill="none" stroke="#4aa3ff" stroke-opacity=".5" stroke-dasharray="4 3"/>
  <circle cx="634" cy="102" r="11" fill="none" stroke="#76b900" stroke-width="3"/>
  <circle cx="634" cy="102" r="4" fill="#76b900"/>
  <text x="652" y="100" font-size="8.5" font-weight="700" fill="#cfd8e2">NVIDIA</text>
  <text x="652" y="111" font-size="8.5" font-weight="700" fill="#9aa4b0">OMNIVERSE</text>
  <text x="665" y="152" text-anchor="middle" font-size="9" fill="#5f6b78">logo · free placed</text>

  <!-- car -->
  <g transform="translate(150,368) scale(0.92)">
    <ellipse cx="232" cy="158" rx="216" ry="15" fill="#000" fill-opacity=".45"/>
    <path d="M20,120 C24,100 46,95 68,92 L128,86 C150,64 188,50 244,50 C300,50 338,64 360,86
             L418,96 C438,100 446,108 446,122 L446,130 C446,138 440,142 432,142
             L30,142 C22,142 16,136 16,128 Z"
          fill="url(#carBody)" stroke="#4b5763"/>
    <path d="M140,84 C158,68 188,58 242,58 C292,58 324,68 344,84 Z" fill="#0f1317" fill-opacity=".85" stroke="#55616e"/>
    <circle cx="108" cy="140" r="27" fill="#0c0f12" stroke="#4b5763"/>
    <circle cx="108" cy="140" r="13" fill="none" stroke="#6c7887" stroke-width="2"/>
    <circle cx="352" cy="140" r="27" fill="#0c0f12" stroke="#4b5763"/>
    <circle cx="352" cy="140" r="13" fill="none" stroke="#6c7887" stroke-width="2"/>
  </g>

  <!-- wordmark slot -->
  <rect x="34" y="518" width="188" height="72" rx="6" fill="none" stroke="#3a434e" stroke-dasharray="4 3"/>
  <text x="128" y="566" text-anchor="middle" font-size="26" font-weight="800" fill="#2f3a45" letter-spacing="4">MC20</text>

  <!-- swatch row -->
  <g>
    <circle cx="300" cy="604" r="13" fill="#e8e6e1" stroke="#7d8896"/>
    <circle cx="340" cy="604" r="13" fill="#17a0dd" stroke="#7d8896"/>
    <circle cx="380" cy="604" r="13" fill="#d14a16" stroke="#e6edf3" stroke-width="2"/>
    <circle cx="420" cy="604" r="13" fill="#9fb3c4" stroke="#7d8896"/>
    <circle cx="460" cy="604" r="13" fill="#c6ccd2" stroke="#7d8896"/>
    <circle cx="500" cy="604" r="13" fill="#79d2b0" stroke="#7d8896"/>
    <circle cx="540" cy="604" r="13" fill="#42c95f" stroke="#7d8896"/>
    <circle cx="580" cy="604" r="13" fill="#1d4ed8" stroke="#7d8896"/>
    <circle cx="620" cy="604" r="13" fill="#8e1420" stroke="#7d8896"/>
    <g font-size="7" fill="#8b95a1" text-anchor="middle">
      <text x="300" y="628">Bianco</text><text x="340" y="628">Blu</text><text x="380" y="628">Giallo</text>
      <text x="420" y="628">Grigio</text><text x="460" y="628">Mistero</text><text x="500" y="628">Mint</text>
      <text x="540" y="628">Punchy</text><text x="580" y="628">Nero</text><text x="620" y="628">Rosso</text>
    </g>
  </g>

  <!-- tabs -->
  <g font-size="9.5" letter-spacing="1">
    <text x="238" y="664" fill="#8b95a1">ENVIRONMENT</text>
    <text x="330" y="664" fill="#4aa3ff" font-weight="700">CAR PAINT</text>
    <rect x="328" y="670" width="66" height="2" fill="#4aa3ff"/>
    <text x="410" y="664" fill="#8b95a1">RIMS</text>
    <text x="456" y="664" fill="#8b95a1">DOOR</text>
    <text x="506" y="664" fill="#8b95a1">LIGHTS</text>
  </g>

  <!-- ===== inspector ===== -->
  <rect x="792" y="42" width="428" height="658" fill="#101418"/>
  <line x1="792" y1="42" x2="792" y2="700" stroke="#232a32"/>

  <g font-size="10">
    <rect x="806" y="56" width="400" height="76" rx="7" fill="#171c22" stroke="#2a323c"/>
    <text x="818" y="74" font-weight="700" fill="#cfd8e2">Full view</text>
    <rect x="884" y="66" width="10" height="10" rx="2" fill="#2d6fc0"/>
    <text x="902" y="74" fill="#8b95a1">show full view button</text>
    <text x="818" y="92" font-weight="700" fill="#cfd8e2">Option text</text>
    <rect x="884" y="84" width="10" height="10" rx="2" fill="#2d6fc0"/>
    <text x="902" y="92" fill="#8b95a1">show labels under options</text>
    <text x="818" y="110" font-weight="700" fill="#cfd8e2">Audio</text>
    <text x="862" y="110" fill="#8b95a1">music + intro + per-option sounds</text>
    <text x="818" y="126" font-weight="700" fill="#cfd8e2">Loading screen</text>
    <text x="898" y="126" fill="#8b95a1">on until the stream is live</text>
  </g>

  <g font-size="10.5">
    <rect x="806" y="144" width="400" height="30" rx="7" fill="#171c22" stroke="#2a323c"/>
    <text x="826" y="163" font-weight="700" fill="#cfd8e2">Camera</text>
    <text x="880" y="163" fill="#6b7682">cameras · 2 options · bottom bar · circle</text>

    <rect x="806" y="182" width="400" height="30" rx="7" fill="#171c22" stroke="#2a323c"/>
    <text x="826" y="201" font-weight="700" fill="#cfd8e2">Environment</text>
    <text x="906" y="201" fill="#6b7682">environments · 2 options · bottom bar</text>
  </g>

  <!-- expanded category -->
  <rect x="806" y="220" width="400" height="462" rx="7" fill="#171c22" stroke="#33404d"/>
  <text x="826" y="239" font-size="10.5" font-weight="700" fill="#cfd8e2">Car Paint</text>
  <text x="886" y="239" font-size="10.5" fill="#6b7682">materials · 9 options · bottom bar</text>

  <g font-size="10">
    <rect x="820" y="250" width="30" height="20" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="835" y="264" text-anchor="middle" font-size="8" fill="#6b7682">ICON</text>
    <rect x="856" y="250" width="164" height="20" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="864" y="264" fill="#c7d0da">Car Paint</text>
    <rect x="1026" y="250" width="100" height="20" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="1034" y="264" fill="#c7d0da">materials  ▾</text>
    <text x="820" y="292" fill="#e26a6a">Delete</text>

    <text x="820" y="322" fill="#8b95a1">Icon px</text>
    <rect x="876" y="313" width="34" height="16" rx="3" fill="#0f1317" stroke="#333c47"/>
    <text x="893" y="325" text-anchor="middle" fill="#c7d0da">40</text>
    <line x1="920" y1="321" x2="1084" y2="321" stroke="#3a434e" stroke-width="3"/>
    <circle cx="988" cy="321" r="6" fill="#4aa3ff"/>
    <text x="1096" y="325" font-size="9" fill="#6b7682">global (40 px)</text>

    <text x="820" y="350" fill="#8b95a1">Labels</text>
    <rect x="876" y="340" width="176" height="18" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="884" y="353" fill="#c7d0da">inherit global — text shown  ▾</text>

    <text x="820" y="378" fill="#8b95a1">Shape</text>
    <rect x="876" y="368" width="126" height="18" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="884" y="381" fill="#c7d0da">inherit — round  ▾</text>
    <text x="1012" y="381" fill="#8b95a1">Dock</text>
    <rect x="1048" y="368" width="78" height="18" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="1056" y="381" fill="#c7d0da">bottom bar ▾</text>

    <text x="820" y="406" fill="#8b95a1">Click</text>
    <rect x="876" y="397" width="10" height="10" rx="2" fill="#2d6fc0"/>
    <text x="894" y="406" fill="#8b95a1">play global click on these options</text>
  </g>

  <!-- option rows -->
  <g font-size="10">
    <rect x="820" y="420" width="372" height="76" rx="6" fill="#141a20" stroke="#2a323c"/>
    <circle cx="844" cy="442" r="9" fill="#e8e6e1" stroke="#7d8896"/>
    <circle cx="866" cy="442" r="9" fill="#cfcac2" stroke="#7d8896"/>
    <rect x="884" y="432" width="118" height="20" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="892" y="446" fill="#c7d0da">Bianco audace</text>
    <text x="1012" y="446" fill="#6b7682">Bianco audace</text>
    <text x="832" y="470" fill="#e26a6a">Remove</text>
    <text x="838" y="490" font-size="9" fill="#8b95a1">🔊 select</text>
    <rect x="896" y="480" width="44" height="14" rx="3" fill="#232a32" stroke="#333c47"/>
    <text x="918" y="490" text-anchor="middle" font-size="9" fill="#b8c2cd">+ sound</text>

    <rect x="820" y="504" width="372" height="76" rx="6" fill="#141a20" stroke="#2a323c"/>
    <circle cx="844" cy="526" r="9" fill="#17a0dd" stroke="#7d8896"/>
    <circle cx="866" cy="526" r="9" fill="#1b8cc4" stroke="#7d8896"/>
    <rect x="884" y="516" width="118" height="20" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="892" y="530" fill="#c7d0da">Blu Infinito</text>
    <text x="1012" y="530" fill="#6b7682">Blu Infinito</text>
    <text x="832" y="554" fill="#e26a6a">Remove</text>
    <text x="838" y="574" font-size="9" fill="#8b95a1">🔊 select</text>
    <rect x="896" y="564" width="44" height="14" rx="3" fill="#232a32" stroke="#333c47"/>
    <text x="918" y="574" text-anchor="middle" font-size="9" fill="#b8c2cd">+ sound</text>

    <rect x="820" y="588" width="372" height="76" rx="6" fill="#141a20" stroke="#2a323c"/>
    <circle cx="844" cy="610" r="9" fill="#d14a16" stroke="#7d8896"/>
    <circle cx="866" cy="610" r="9" fill="#b03d12" stroke="#7d8896"/>
    <rect x="884" y="600" width="118" height="20" rx="4" fill="#0f1317" stroke="#333c47"/>
    <text x="892" y="614" fill="#c7d0da">Giallo Genio</text>
    <text x="1012" y="614" fill="#6b7682">Giallo Genio</text>
    <text x="832" y="638" fill="#e26a6a">Remove</text>
    <text x="838" y="658" font-size="9" fill="#8b95a1">🔊 select</text>
    <rect x="896" y="648" width="44" height="14" rx="3" fill="#232a32" stroke="#333c47"/>
    <text x="918" y="658" text-anchor="middle" font-size="9" fill="#b8c2cd">+ sound</text>
  </g>
</svg>
