<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420"
     role="img" aria-labelledby="hfTitle hfDesc"
     font-family="Segoe UI, system-ui, sans-serif">
  <title id="hfTitle">What the tool changes in the stage hierarchy</title>
  <desc id="hfDesc">Before: six prims sit flat under a World prim, with the three wheel parts mixed in among the body and glass. After: two new Xform prims, Car and Tyre_Group_FL, have been created under /scene, and the three wheel parts now sit inside them, keeping their original leaf names. Each moved prim is given one baked transform so it stays exactly where it was, and rigged meshes have their skinning baked first at the SkelRoot.</desc>

  <defs>
    <marker id="hfArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4aa3ff"/>
    </marker>
  </defs>

  <rect width="1060" height="420" fill="#0e1013"/>

  <!-- before -->
  <g font-family="Consolas, ui-monospace, monospace">
    <text x="40" y="44" font-size="11.5" font-weight="700" fill="#7d8896"
          font-family="Segoe UI, system-ui, sans-serif" letter-spacing="1.6">BEFORE</text>
    <rect x="40" y="58" width="420" height="214" rx="10" fill="#171c22" stroke="#2a323c"/>

    <text x="62" y="88" font-size="12.5" fill="#c7d0da">/World</text>
    <text x="86" y="116" font-size="12.5" fill="#8fd0ff">Tyre_FL_rim</text>
    <text x="86" y="144" font-size="12.5" fill="#8fd0ff">Tyre_FL_tread</text>
    <text x="86" y="172" font-size="12.5" fill="#c7d0da">Body_shell</text>
    <text x="86" y="200" font-size="12.5" fill="#8fd0ff">Tyre_FL_bolts</text>
    <text x="86" y="228" font-size="12.5" fill="#c7d0da">Glass_windshield</text>
    <text x="86" y="256" font-size="12.5" fill="#c7d0da">Body_bonnet</text>

    <path d="M74,96 L74,250" stroke="#3b4652" stroke-width="1.2"/>
  </g>

  <!-- after -->
  <g font-family="Consolas, ui-monospace, monospace">
    <text x="600" y="44" font-size="11.5" font-weight="700" fill="#4aa3ff"
          font-family="Segoe UI, system-ui, sans-serif" letter-spacing="1.6">AFTER</text>
    <rect x="600" y="58" width="420" height="214" rx="10" fill="#171c22" stroke="#2a323c"/>

    <text x="622" y="88" font-size="12.5" fill="#c7d0da">/scene</text>
    <text x="646" y="116" font-size="12.5" fill="#e6edf3">Car</text>
    <text x="700" y="116" font-size="10.5" fill="#4aa3ff"
          font-family="Segoe UI, system-ui, sans-serif">new Xform</text>
    <text x="670" y="144" font-size="12.5" fill="#e6edf3">Tyre_Group_FL</text>
    <text x="790" y="144" font-size="10.5" fill="#4aa3ff"
          font-family="Segoe UI, system-ui, sans-serif">new Xform</text>
    <text x="694" y="172" font-size="12.5" fill="#8fd0ff">Tyre_FL_rim</text>
    <text x="694" y="200" font-size="12.5" fill="#8fd0ff">Tyre_FL_tread</text>
    <text x="694" y="228" font-size="12.5" fill="#8fd0ff">Tyre_FL_bolts</text>
    <path d="M616,240 L1004,240" stroke="#2a323c"/>
    <text x="622" y="262" font-size="12" fill="#6b7683">/World  everything not selected, untouched</text>

    <path d="M634,96 L634,110" stroke="#3b4652" stroke-width="1.2"/>
    <path d="M658,124 L658,138" stroke="#4aa3ff" stroke-opacity=".55" stroke-width="1.2"/>
    <path d="M682,152 L682,222" stroke="#4aa3ff" stroke-opacity=".55" stroke-width="1.2"/>
  </g>

  <path d="M472,166 L588,166" stroke="#4aa3ff" stroke-opacity=".55" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#hfArrow)" fill="none"/>
  <text x="530" y="152" text-anchor="middle" font-size="11" fill="#7d8896">one click</text>

  <!-- the part that is actually hard -->
  <g>
    <rect x="40" y="300" width="980" height="92" rx="10" fill="#10151a" stroke="#2f3a45"/>
    <text x="64" y="330" font-size="13" font-weight="700" fill="#e6edf3">Reparenting in the outliner is what breaks a scene — so this does the matrix work instead.</text>
    <text x="64" y="354" font-size="12" fill="#9aa4b0">A prim's placement is the product of every transform above it. Move it to a new parent and that product changes,</text>
    <text x="64" y="374" font-size="12" fill="#9aa4b0">so the geometry jumps or stretches. Each moved prim is given one baked transform that cancels the difference out.</text>
  </g>
</svg>
